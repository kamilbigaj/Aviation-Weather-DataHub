name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    # Add placeholder environment variables to prevent tests from failing
    # if they attempt to load the .env file and the required keys are missing
    env:
      AERO_API_KEY: "dummy_key"
      POSTGRES_PASSWORD: "dummy_password"
      DATABASE_URL: "sqlite:///:memory:"
      AWS_ACCESS_KEY_ID: "dummy_aws_key"
      AWS_SECRET_ACCESS_KEY: "dummy_aws_secret"
      AWS_REGION: "eu-central-1"
      S3_BUCKET_NAME: "dummy-bucket"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/